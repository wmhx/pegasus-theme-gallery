name: Update theme gallery

on:
  schedule:
    - cron: "17 3 * * 1"   # 每周一 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "data/repos.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Sync repos.txt from upstream
        run: |
          curl -sSL https://raw.githubusercontent.com/mmatyas/pegasus-theme-gallery-db/master/repos.txt \
            -o data/repos.txt

      - name: Generate gallery
        run: |
          python scripts/generate.py
          python scripts/preview.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs data assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh theme gallery"
            git push
          fi
